name = "pm-tracker"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 (SQLite) database. After `wrangler d1 create pm-db`,
# paste the returned database_id here. The same binding is consumed
# by Pages Functions as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "pm-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true
